      description: "Retrieves paginated access control statuses for resources when\
        \ the company acts as a contractor. Results are filtered based on the user's\
        \ client company and site visibility. Subcontractor filtering (`companyScope`\
        \ and `contractorIds`). Results are always reported at site level: when a\
        \ client uses site hierarchy, assignments at deeper levels (zone, area) are\
        \ grouped into their site ancestor and the reported status is the rollup for\
        \ that branch. `activeEntry` follows the same rule — an entry registered at\
        \ a deeper level is attributed to the site, so its `siteId` names the reported\
        \ site rather than identifying where the entry was registered. **Allowed sort\
        \ fields:** `client_name` (client company name); `contractor_name` (contractor\
        \ company name); `resource_name` (resource name: employee, vehicle, or equipment);\
        \ `site_name` (site name, default); `end_of_access` (end of access date).\
        \ **Sort format:** `?sort=field,direction` (e.g. `?sort=site_name,asc`)."
      operationId: getAccessControlStatusByContractor
      parameters:
      - name: companyId
        in: path
        description: Company ID acting as contractor
        required: true
        schema:
          type: string
          format: uuid
      - name: clientId
        in: query
        description: Deprecated — use 'clientIds' instead.
        required: false
        deprecated: true
        schema:
          type: string
          format: uuid
      - name: clientIds
        in: query
        description: "Filter by client IDs (multi-value). Replaces deprecated 'clientId'.\
          \ Results are automatically filtered based on user's client company visibility.\
