openapi: 3.1.0
info:
  title: Public API
  description: |-
    API for external systems to integrate with Twind using public API keys.
    Additional products may extend this document over time.

    ## Authentication

    Use the `X-Api-Key` header with your public API key.
  contact:
    name: Twind Support
    email: support@twind.com
  version: "1.0"
servers:
- url: https://app.twind.io/api
  description: Production server
tags:
- name: Shared
  description: |-
    Shared endpoints for who is calling the API, which companies apply, and common lists used to filter other operations.

    - **Me**: Current user and permissions for the API key
    - **User companies**: Companies visible to the authenticated user
    - **My companies**: Related companies (contractors/clients) for a company
    - **Countries**: List countries
    - **Sites**: List sites for a company
    - **Activities**: List company activities
    - **Assigned resources**: Resources assigned to contracts (client view)
    - **Assigned resources (contractor)**: Resources assigned to contracts (contractor view)
    - **Clients**: Client companies for a contractor
    - **Users**: List users for a company
    - **Employees**: List employees for a company
    - **Vehicles**: List vehicles for a company
    - **Equipment**: List equipment for a company
    - **Contracts (as contractor)**: List contracts where the company acts as contractor
    - **Contract engagements**: List engagements for a contract
- name: Access control
  description: |-
    Track people and assets on site: register access and visits, query authorization status, and issue access cards.

    - **Visitors**: List, create, read, and update visitor records; presigned upload URL; plate numbers and visitor companies
    - **Visit register**: List and create visits; read and update a visit record
    - **Access register**: List and create access entries; record exit; read entry by id
    - **Access control (status)**: Read access control row by id; list as contractor or as client
    - **Access card**: Download access card file (PDF or PNG) for a resource
    - **Temporary authorizations**: List, create, read, update, and delete; search names and authorizers
    - **All contractors**: List all contractors for a company
- name: Requirements
  description: |-
    Configure contract requirements, inspect requirement instances, and submit or review evidence against them.

    - **Requirement (detail)**: Get and update a requirement configuration
    - **Requirements (list)**: List and create requirements
    - **Requirement template upload**: Presigned URL to upload a requirement template file
    - **Requirement stats**: Statistics for a requirement
    - **Requirement enable/disable**: Enable or disable a requirement for a company
    - **Requirement instance**: Get a requirement instance
    - **Requirement instance logs**: List change logs for an instance
    - **Eligible resources**: List resources eligible for an instance
    - **Requirement instances (contractor)**: List instances and contractor requirement index
    - **Requirement instances (client)**: List instances for the client company
    - **Evidence file upload URL**: Presigned URL for evidence file upload
    - **Evidence agreement**: Submit agreement-type evidence
    - **Evidence (read/update)**: Get or update an evidence record
    - **Evidence approve**: Approve evidence
    - **Evidence reject**: Reject evidence
    - **Evidence matching**: Match submitted evidence to requirement instances
- name: Companies and contracts
  description: |-
    Manage company profile, sites, commercial relationships, contracts, engagements, and subcontracts.

    - **Company summary**: Read and patch company summary
    - **Contractors**: Create contractors; list contractors with active contracts (my-contractors)
    - **Child subcontractors**: List child subcontractor companies
    - **Sites**: Create a site; read or update a site; list sites as contractor
    - **Contracts**: Create, update, and soft-delete contracts; list with-contractors filter
    - **Contract engagements**: Create engagements for a contract; soft-delete engagement
    - **Subcontracts**: Create subcontracts; subcontract requests (list, create, approve, reject); list as contractor; read by engagement
paths:
  /v1/users/me:
    get:
      tags:
      - Shared
      summary: Get current user information
      description: "Retrieves detailed information about the currently authenticated\
        \ user, including their profile, permissions, company associations and userSettings\
        \ (e.g. mobile unattended mode)."
      operationId: me
      parameters:
      - name: companyId
        in: query
        description: Optional company ID to get permissions for (only applicable for
          Global Admins)
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully retrieved user information
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDetails"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDetails"
  /v1/users/me/companies:
    get:
      tags:
      - Shared
      summary: Get current user's companies
      description: Retrieves the list of companies that the currently authenticated
        user has access to.
      operationId: meCompanies
      responses:
        "200":
          description: Successfully retrieved user's companies
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCompanyInfo"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCompanyInfo"
  /v1/companies/{id}/my-companies:
    get:
      tags:
      - Shared
      summary: List related companies
      description: "Retrieves paginated list of related companies (contractors or\
        \ clients). Use this endpoint to obtain company IDs for filtering in other\
        \ endpoints. **Allowed sort fields:** `name` (company name, default); `taxId`\
        \ (tax ID); `industry` (industry key); `email` (company email). **Sort format:**\
        \ `?sort=field,direction` (e.g. `?sort=name,asc`)."
      operationId: findAllContractors
      parameters:
      - name: id
        in: path
        description: Company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: "Text search term, matched against company name, email, and tax\
          \ ID. Ignored when filterById is set."
        required: false
        schema:
          type: string
          description: "Text search term, matched against company name, email, and\
            \ tax ID. Ignored when filterById is set."
      - name: filterById
        in: query
        description: "When set, performs a point-lookup by ID and ignores the 'q'\
          \ search parameter."
        required: false
        schema:
          type: string
          format: uuid
          description: "When set, performs a point-lookup by ID and ignores the 'q'\
            \ search parameter."
      - name: filterByIds
        in: query
        description: "When set, performs a batch lookup by IDs. The 'q' search parameter\
          \ is ignored. If combined with filterById, filterById is ignored."
        required: false
        schema:
          type: array
          description: "When set, performs a batch lookup by IDs. The 'q' search parameter\
            \ is ignored. If combined with filterById, filterById is ignored."
          items:
            type: string
            format: uuid
            description: "When set, performs a batch lookup by IDs. The 'q' search\
              \ parameter is ignored. If combined with filterById, filterById is ignored."
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved companies list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelMyCompanyDataDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelMyCompanyDataDto"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelMyCompanyDataDto"
  /v1/countries:
    get:
      tags:
      - Shared
      summary: List countries
      description: Paginated countries catalog. Filter by partial **name** match.
      operationId: findAll_6
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved countries
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelSystemCountry"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{companyId}/activities:
    get:
      tags:
      - Shared
      summary: List client activities
      description: "Returns a paginated list of activities defined for the company\
        \ (client configuration). **Sort format:** `sort=name,asc` (default: name\
        \ ascending)."
      operationId: findAll_5
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: selected
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: companyId
        in: path
        description: Company ID (client)
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Paged activities
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelActivityDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{id}/assigned-resources:
    get:
      tags:
      - Shared
      summary: List assigned resources (as client)
      description: "Retrieves a paginated list of resources (employees, vehicles,\
        \ equipment) assigned to contracts where the company acts as client. The result\
        \ covers the whole contract tree: direct contractors and any subcontractors\
        \ they have engaged, because subcontracts inherit the head client's id. One\
        \ row per resource. Use this endpoint to obtain resource ids for filtering\
        \ in access-control endpoints or when a lightweight listing is enough. Max\
        \ page size: 100."
      operationId: findAssignedResources
      parameters:
      - name: id
        in: path
        description: Client company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search query to filter resources by name
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        description: Filter by a single resource ID. Combined with resourceIds using
          OR — the result is the union of both.
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceType
        in: query
        description: "Filter by resource type (EMPLOYEE, VEHICLE, EQUIPMENT). Deprecated:\
          \ use resourceTypes instead. If both resourceType and resourceTypes are\
          \ provided, they are combined using OR."
        required: false
        schema:
          type: string
      - name: resourceTypes
        in: query
        description: "Filter by resource types (EMPLOYEE, VEHICLE, EQUIPMENT)"
        required: false
        schema:
          type: array
          items:
            type: string
      - name: contractorIds
        in: query
        description: Filter by specific contractor IDs
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: resourceIds
        in: query
        description: Filter by multiple resource IDs. Combined with resourceId using
          OR — the result is the union of both.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved resources list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceBasicData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceBasicData"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceBasicData"
  /v1/companies/{id}/assigned-resources-detailed:
    get:
      tags:
      - Shared
      summary: List assigned resources with detailed information (as client)
      description: "Retrieves a paginated list of resources assigned to contracts\
        \ where the company acts as client. Each resource carries its per-resource\
        \ attributes (employee identity, vehicle plate, equipment serial, etc.) plus\
        \ an 'engagements' array describing every (contract, site, activity) where\
        \ that resource is currently deployed. For EMPLOYEE resources, each engagement\
        \ also lists the risks assigned on that specific assignment. Pagination is\
        \ per resource — a resource deployed on N engagements is one page entry with\
        \ N items in 'engagements'. The result covers the whole contract tree including\
        \ subcontractors, because subcontracts inherit the head client's id. Max page\
        \ size: 100."
      operationId: findAssignedDetailedResources
      parameters:
      - name: id
        in: path
        description: Client company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search query to filter resources by name
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        description: Filter by a single resource ID. Combined with resourceIds using
          OR — the result is the union of both.
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceType
        in: query
        description: "Filter by resource type (EMPLOYEE, VEHICLE, EQUIPMENT). Deprecated:\
          \ use resourceTypes instead. If both resourceType and resourceTypes are\
          \ provided, they are combined using OR."
        required: false
        schema:
          type: string
      - name: resourceTypes
        in: query
        description: "Filter by resource types (EMPLOYEE, VEHICLE, EQUIPMENT)"
        required: false
        schema:
          type: array
          items:
            type: string
      - name: contractorIds
        in: query
        description: Filter by specific contractor IDs
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: resourceIds
        in: query
        description: Filter by multiple resource IDs. Combined with resourceId using
          OR — the result is the union of both.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved resources list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceDetailedData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceDetailedData"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceDetailedData"
  /v1/companies/{id}/assigned-resources/as-contractor:
    get:
      tags:
      - Shared
      summary: List assigned resources with detailed information (as contractor)
      description: "Retrieves a paginated list of resources (employees, vehicles,\
        \ equipment) assigned to contracts where the company acts as contractor, across\
        \ all its client relationships. Each resource carries per-type attributes\
        \ plus an 'engagements' array describing every (contract, site, activity)\
        \ where the resource is currently deployed. For EMPLOYEE resources, each engagement\
        \ lists the risks assigned on that specific assignment. Use 'companyScope'\
        \ to include resources from the contractor's own subcontractors (requires\
        \ the RESOURCE_READ_SUBCONTRACTOR permission). Max page size: 100."
      operationId: findAssignedResourcesAsContractor
      parameters:
      - name: id
        in: path
        description: Contractor company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search query to filter resources by name
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        description: Filter by a single resource ID. Combined with resourceIds using
          OR — the result is the union of both.
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceType
        in: query
        description: "Filter by resource type (EMPLOYEE, VEHICLE, EQUIPMENT). Deprecated:\
          \ use resourceTypes instead. If both resourceType and resourceTypes are\
          \ provided, they are combined using OR."
        required: false
        schema:
          type: string
      - name: resourceTypes
        in: query
        description: "Filter by resource types (EMPLOYEE, VEHICLE, EQUIPMENT)"
        required: false
        schema:
          type: array
          items:
            type: string
      - name: companyScope
        in: query
        description: "Filter by subcontractor scope (MY_COMPANY, MY_SUBCONTRACTORS,\
          \ ALL)"
        required: false
        schema:
          type: string
          enum:
          - ALL
          - MY_COMPANY
          - MY_SUBCONTRACTORS
      - name: contractorIds
        in: query
        description: Filter by specific contractor IDs
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: resourceIds
        in: query
        description: Filter by multiple resource IDs. Combined with resourceId using
          OR — the result is the union of both.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved resources list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceDetailedData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceDetailedData"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceDetailedData"
  /v1/companies/{contractorId}/clients:
    get:
      tags:
      - Shared
      summary: List client companies
      description: Retrieves paginated list of client companies for a contractor.
        Use this endpoint to obtain client IDs for filtering in access-control endpoints.
      operationId: findClients
      parameters:
      - name: contractorId
        in: path
        description: Contractor company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search query to filter clients by name
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved clients list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCompanyClientData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCompanyClientData"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCompanyClientData"
  /v1/companies/{companyId}/users:
    get:
      tags:
      - Shared
      summary: List company users
      description: "Returns a paginated list of users for the company. Supports optional\
        \ search (q), role filters, and selected user IDs."
      operationId: findUsers
      parameters:
      - name: companyId
        in: path
        description: Company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search text (partial match)
        required: false
        schema:
          type: string
      - name: role
        in: query
        description: Filter by a single role ID
        required: false
        schema:
          type: string
          format: uuid
      - name: roles
        in: query
        description: Filter by role IDs
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: selected
        in: query
        description: Optional subset of user IDs to include
        required: false
        schema:
          type: array
          items:
            type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{companyId}/employees:
    get:
      tags:
      - Shared
      summary: List employees
      description: "Returns a paginated list of employees for a contractor company.\
        \ Used to locate the internal `resourceId` needed for contract engagement\
        \ assignment. The `q` parameter performs a partial match against `firstName`,\
        \ `lastName`, `identity` (DNI/passport/SSN), and `email`. **Allowed sort fields:**\
        \ `firstName`, `lastName`, `identity`, `email`, `phone`, `country.name`. **Sort\
        \ format:** `sort=field,direction` (e.g. `?sort=lastName,asc`)."
      operationId: findAll_4
      parameters:
      - name: q
        in: query
        description: Search query (partial match on employee fields)
        required: false
        schema:
          type: string
      - name: clientId
        in: query
        description: "When set, restricts results to resources for this client company"
        required: false
        schema:
