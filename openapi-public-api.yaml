        in: query
        description: "Filter by resource discriminator (e.g. EMPLOYEE, VEHICLE, EQUIPMENT)"
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Filter entries with entry_at on or after this instant (inclusive)
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Filter entries with entry_at on or before this instant (inclusive)
        required: false
        schema:
          type: string
          format: date-time
      - name: entryOnly
        in: query
        description: "When true, only entries without an exit are returned"
        required: false
        schema:
