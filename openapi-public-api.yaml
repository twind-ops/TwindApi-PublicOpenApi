      type: object
      description: "Body for [POST /v1/companies/{companyId}/visit-register](#tag/visit-register-controller/POST/v1/companies/{companyId}/visit-register).\
        \ Registers a visitor entering a site."
      properties:
        siteId:
          type: string
          format: uuid
          description: "Site where the visit takes place. Obtain IDs from [GET /v1/companies/{companyId}/sites](#tag/site-controller/GET/v1/companies/{companyId}/sites)."
        visitorId:
          type: string
          format: uuid
          description: "Visitor for this visit. Use a visitor ID from [GET /v1/companies/{companyId}/visitor](#tag/visitor-controller/GET/v1/companies/{companyId}/visitor)\
            \ or create one with [POST /v1/companies/{companyId}/visitor](#tag/visitor-controller/POST/v1/companies/{companyId}/visitor)."
        visitedPerson:
          type: string
          description: Name of the employee or host being visited (free text as recorded
            at entry).
          minLength: 1
        entryAt:
          type: string
          format: date-time
          description: Date and time when the visitor entered the site (ISO-8601 offset
            datetime).
          example: 2026-03-30T14:30:00+00:00
        entryReason:
          type: string
          description: Reason for the visit.
          minLength: 1
        entryNotes:
          type: string
          description: Optional notes for the entry.
        entryOrigin:
          type: string
          description: "Origin of the visit entry registration. Indicates where the\
            \ entry was recorded (e.g. web portal, mobile app or API). Optional; defaults\
            \ to WEB when omitted."
          enum:
          - WEB
          - APP
          - API
          example: WEB
      required:
      - entryAt
      - entryReason
      - siteId
      - visitedPerson
      - visitorId
    CreateVehicleDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        registrationPlate:
          type: string
          minLength: 1
        vehicleType:
          type: string
          format: uuid
          description: Standard vehicle type id. Obtain from `GET /v1/standard-vehicle-types`.
        manufacturer:
          type: string
        model:
          type: string
        tareWeight:
          type: integer
          format: int32
        photo:
          type: string
        classifications:
          type: array
          description: "Client-specific classifications for the vehicle. Each entry\
            \ ties the vehicle to a client company (`clientId`, from `GET /v1/companies/{contractorId}/clients`)\
            \ and to one of that client's vehicle type classifications (`clientResourceTypeId`,\
            \ from `GET /v1/companies/{companyId}/classification/vehicle-types`).\
            \ Required when the client mandates a classification before the vehicle\
            \ can be assigned to their contracts."
          items:
            $ref: "#/components/schemas/ResourceCreateClassificationDto"
          uniqueItems: true
      required:
      - classifications
      - name
      - registrationPlate
      - vehicleType
    ResourceCreateClassificationDto:
      type: object
      properties:
        clientId:
          type: string
