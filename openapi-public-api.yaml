    ContractData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        principal:
          type: boolean
        level:
          type: integer
          format: int32
        mainContractor:
          $ref: "#/components/schemas/Company"
        contractor:
          $ref: "#/components/schemas/Company"
        client:
          $ref: "#/components/schemas/ClientCompany"
        sites:
          type: array
          deprecated: true
          description: Use engagements instead. Will be removed in a future version.
          items:
            $ref: "#/components/schemas/SiteInfoAndActivities"
        engagements:
          type: array
          items:
            $ref: "#/components/schemas/EngagementSummary"
        resources:
          $ref: "#/components/schemas/ResourceData"
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        requirements:
          $ref: "#/components/schemas/Requirements"
        manager:
          $ref: "#/components/schemas/Manager"
        project:
          $ref: "#/components/schemas/ProjectRef"
        approvalState:
          type: string
          deprecated: true
          description: Use validationState instead. Will be removed once consumers
            migrate.
          enum:
          - PENDING_VALIDATION
          - APPROVED
          - PARTIALLY_APPROVED
          - REJECTED
          - NONE
        validationState:
          type: string
          enum:
          - PENDING_VALIDATION
          - RESOLVED
          - NONE
        pendingValidationCount:
          type: integer
          format: int32
        rejectedValidationCount:
          type: integer
          format: int32
          deprecated: true
          description: Use unacknowledgedRejectedCount instead. Counts all rejected
            items regardless of acknowledgement.
        unacknowledgedRejectedCount:
          type: integer
          format: int32
        hasSubcontracts:
          type: boolean
        hasUnresolvedMandatoryRiskConflicts:
          type: boolean
        specialWorks:
          type: array
          description: "Distinct Special Works activities among this contract's engagements.\
            \ Empty when the Special Works add-on is off for the client, or when the\
            \ contract has none. Read-only projection of engagement data (Phase A);\
            \ will union with contract-level Special Works attachments once the write\
            \ path lands."
          items:
            $ref: "#/components/schemas/IdAndNameV2"
        pendingApproval:
          type: boolean
          description: "True for a subcontract this company has been invited to that\
            \ is still awaiting client approval, i.e. a `subcontract_request` with\
            \ no contract row yet. Only ever true when the list was fetched with showPendingSubcontracts=true.\
            \ Unrelated to the resource-assignment validation fields (validationState\
            \ / pendingValidationCount). Active/scheduled/expired is deliberately\
            \ NOT returned: it stays derived from dateFrom/dateTo by the caller, in\
            \ the viewer's own timezone. Note that `id` is a `subcontract_request`\
            \ id on such an entry, not a contract id."
        contractorId:
          type: string
          format: uuid
          description: Convenience alias for contractor.id
        siteIds:
          type: array
          description: "IDs of the sites directly engaged by this contract, i.e. sites.map\
            \ { it.id }"
          items:
            type: string
            format: uuid
      required:
      - client
      - contractor
      - contractorId
      - dateFrom
      - dateTo
      - engagements
      - hasSubcontracts
      - hasUnresolvedMandatoryRiskConflicts
      - id
      - level
      - mainContractor
      - name
      - pendingApproval
      - principal
      - requirements
      - resources
      - siteIds
      - sites
      - specialWorks
    EngagementSummary:
      type: object
