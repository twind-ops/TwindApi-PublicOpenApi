        activity:
          $ref: "#/components/schemas/Activity"
        scopeSites:
          type: array
          items:
            $ref: "#/components/schemas/SiteInfo"
        hasUnresolvedMandatoryRiskConflicts:
          type: boolean
          description: "True when the buyer's active mandatory-risk coverage rules\
            \ for this activity are not all held by this engagement's own live, unblocked\
            \ employees. Each engagement is judged on its own assignments, so a subcontractor's\
            \ employees never cover its parent. False when covered, or when neither\
            \ the mandatory-risks nor the Special Works add-on enforces this activity\
            \ for the buyer."
