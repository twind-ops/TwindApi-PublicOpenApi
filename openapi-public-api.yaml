        in: query
        description: "Inclusive upper bound on entry date (`YYYY-MM-DD`, entry time\
          \ before start of the next day UTC)."
        required: false
        schema:
          type: string
          format: date
          description: "Inclusive upper bound on entry date (`YYYY-MM-DD`, entry time\
            \ before start of the next day UTC)."
          example: 2026-03-31
        example: 2026-03-31
      - name: plateNumbers
        in: query
        required: false
        schema:
          type: array
          description: Vehicle registration plates (exact match list).
          items:
            type: string
