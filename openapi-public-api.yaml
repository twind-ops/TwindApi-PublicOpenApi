        subjectId:
          type: string
          format: uuid
        documentTypeId:
          type: string
          format: uuid
        files:
          type: array
          items:
            type: string
          minItems: 1
        issueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
      required:
