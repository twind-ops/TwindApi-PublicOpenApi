          items:
            type: string
      - name: subcontractingLevel
        in: query
        description: "Filter by subcontracting level (0 = Main contract, ≥1 = Subcontract\
          \ level N)"
        required: false
        schema:
          type: integer
          format: int32
      - name: showExpired
        in: query
        description: "When true, includes contracts whose end date has passed alongside\
          \ active contracts."
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Successfully retrieved payment authorization rows by contract
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponsePaymentAuthorizationByContractRowDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions or Payment Authorization\
            \ product not enabled for company"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{clientId}/payment-authorization/by-contract/{contractId}:
    get:
      tags:
      - Contract status
      summary: Get payment authorization detail for a contract
      description: "Returns the payment authorization status, the contracts that make\
        \ up the chain, and any blocking requirement issues for the given contract.\
        \ In **Individual** mode the detail is scoped to this single contract; in\
        \ **Subcontracting Chain** mode the whole subcontracting tree is evaluated\
        \ as one unit, so `contracts[]` lists every active contract in the tree (each\
        \ with its own contractor) and `issues[]` spans every contributing contractor;\
        \ in this mode an expired viewed contract is always Authorized and shows no\
        \ issues. When the status is not authorized, `issues[]` lists the failing\
        \ requirement instances. To obtain the full requirement configuration and\
        \ evidence detail for each, take its `requirementInstanceId` and call the\
        \ Requirements API: `GET /v1/companies/{companyId}/requirement-instances/{instanceId}`\
        \ (the API key must also have the Requirements API product subscribed)."
      operationId: getByContractDetail
      parameters:
      - name: clientId
        in: path
        description: Client company ID. UUID of the client company. Obtain it from
          `GET /v1/users/me/companies` (field `companyId`).
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        description: Contract ID. UUID of the contract. Obtain it from the `by-contract`
          list response (field `contract.id`).
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully retrieved payment authorization detail
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentAuthorizationContractDetailDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions or Payment Authorization\
            \ product not enabled for company"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No contract found for this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{clientId}/payment-authorization/config:
    get:
      tags:
      - Calculation mode
      summary: Get the Payment Authorization calculation mode configuration
      description: Returns the client's current Payment Authorization calculation
        mode. Defaults to `INDIVIDUAL` when no explicit mode has been saved.
      operationId: getConfig
      parameters:
      - name: clientId
        in: path
        description: Client company ID. UUID of the client company. Obtain it from
          `GET /v1/users/me/companies` (field `companyId`).
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully retrieved config
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentAuthorizationConfigDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions or Payment Authorization\
            \ product not enabled for company"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - Calculation mode
      summary: Update the Payment Authorization calculation mode
      description: Sets the client's Payment Authorization calculation mode. The change
        is recorded in the configuration history.
      operationId: updateConfig
      parameters:
      - name: clientId
        in: path
        description: Client company ID. UUID of the client company. Obtain it from
          `GET /v1/users/me/companies` (field `companyId`).
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentAuthorizationConfigDto"
        required: true
      responses:
        "204":
          description: Calculation mode updated
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Payment Authorization product not enabled for company (returned\
            \ instead of 403 for callers who bypass product-gating, e.g. Global Admin)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{clientId}/payment-authorization/history:
    get:
      tags:
      - Calculation mode
      summary: Get the Payment Authorization configuration change history
      description: "Returns mode/activation events for the client's Payment Authorization\
        \ product (most recent first): product activated, product deactivated, and\
        \ calculation mode changes. Each entry includes the timestamp and the actor\
        \ (name + email)."
      operationId: getHistory
      parameters:
      - name: clientId
        in: path
        description: Client company ID. UUID of the client company. Obtain it from
          `GET /v1/users/me/companies` (field `companyId`).
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved history
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponsePaymentAuthorizationHistoryEventDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions or Payment Authorization\
            \ product not enabled for company"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/cm/companies/{companyId}/evidences/upload:
    post:
      tags:
      - Submissions
      summary: Submit document
      description: Registers a document after uploads completed using the presigned
        URL from temporary-upload-url.
      parameters:
      - name: companyId
        in: path
        description: Acting company id
        required: true
        schema:
          type: string
          format: uuid
      - name: asSubcontractorId
        in: query
        description: "When set, submit on behalf of this subcontractor company; chain\
          \ access is validated."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filePaths:
                  type: array
                  description: Object storage keys for uploaded files (same keys returned
                    from the presigned upload flow).
                  items:
                    type: string
                  minItems: 1
                issueDate:
                  type: string
                  format: date
                  description: Document date of issue.
                  minLength: 1
                requirementInstanceId:
                  type: string
                  format: uuid
                  description: Requirement instance id for an upload-type requirement.
                comments:
                  type: string
                  description: Optional note from the submitter.
                createdAt:
                  type: string
                  format: date-time
                  description: Evidence creation time; defaults to server time when
                    omitted.
                expirationDate:
                  type: string
                  format: date
                  description: Document expiration date when applicable.
                expressValidation:
                  type: boolean
                  description: Request express validation when the client has document
                    management enabled.
                requirementDoesNotApply:
                  type: boolean
                  description: "When true, marks the requirement as not applicable;\
                    \ comments are required in that case."
              required:
              - filePaths
              - issueDate
              - requirementInstanceId
            example:
              filePaths:
              - evidences/company-1/bucket-key-1
              issueDate: 2025-06-15
              requirementInstanceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              comments: Optional note from the submitter.
              createdAt: 2025-06-15T12:30:00Z
              expirationDate: 2028-06-15
              expressValidation: true
              requirementDoesNotApply: false
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
                title: IdValue
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
components:
  schemas:
    IdsResponse:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - ids
    SetSiteResourceDto:
      type: object
      description: "A resource to assign at a (contract, site) pair, with optional\
        \ risks for employee resources."
      properties:
        resourceId:
          type: string
          format: uuid
          description: "Contractor resource id to assign. Obtain the UUID from `GET\
            \ /v1/companies/{companyId}/employees`, `.../vehicles`, or `.../equipment`."
        riskIds:
          type: array
          description: "Risk ids to associate with this resource at assignment time\
            \ (employees only). Obtain from `GET /v1/companies/{companyId}/risks`.\
            \ Omit or pass an empty list for non-employee resources."
          items:
            type: string
            format: uuid
        employeeJobPosition:
          type: string
          description: "Optional job position for an employee resource. When omitted\
            \ for an employee, the employee's stored default position is used. Ignored\
            \ for non-employee resources."
      required:
      - resourceId
      - riskIds
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    SetSiteResourceRisksDto:
      type: object
      description: Complete set of risk ids to associate with a resource assigned
        at a site.
      properties:
        riskIds:
          type: array
          description: "Complete set of risk ids to associate with the assigned resource.\
            \ Obtain from `GET /v1/companies/{companyId}/risks`. Any risk currently\
            \ associated but not included here is removed."
          items:
            type: string
            format: uuid
      required:
      - riskIds
    SetContractSiteResourcesDto:
      type: object
      description: Resource assignment for a single site within a contract.
      properties:
        siteId:
          type: string
          format: uuid
          description: Site ID to assign resources to. Must be a site with an active
            engagement on the contract.
        resources:
          type: array
          description: Complete set of resources to assign at this site. Resources
            currently assigned but absent from this list are unassigned.
          items:
            $ref: "#/components/schemas/SetSiteResourceDto"
      required:
      - resources
      - siteId
    CreateVisitorDto:
      type: object
      description: "Payload to create or update a visitor. Used by [POST /v1/companies/{companyId}/visitor](#tag/visitor-controller/POST/v1/companies/{companyId}/visitor)\
        \ and [PUT /v1/companies/{companyId}/visitor/{visitorId}](#tag/visitor-controller/PUT/v1/companies/{companyId}/visitor/{visitorId})."
      properties:
        visitorName:
          type: string
          description: Visitor given name.
          minLength: 1
        visitorSurname:
          type: string
          description: Visitor family name.
          minLength: 1
        visitorIdentityType:
          type: string
          description: "Type of identity document (e.g. national ID, passport)."
          example: PASSPORT
          minLength: 1
        visitorIdentity:
          type: string
          description: Identity document number; must be unique for active visit checks.
          minLength: 1
        visitorEmail:
          type: string
          format: email
          description: Contact email when provided.
        visitorPlateNumber:
          type: string
          description: Vehicle registration plate when applicable; omit or empty if
            none.
          pattern: .*\S.*
        companyName:
          type: string
          description: Visitor company or organization name.
          minLength: 1
        companyTaxId:
          type: string
          description: Tax or company registration ID for the visitor organization.
            Optional — visitors often do not know their company's tax ID.
        files:
          type: array
          description: "S3 object keys for uploaded visitor documents, after uploading\
            \ via [GET /v1/companies/{companyId}/visitor/temporary-upload-url](#tag/visitor-controller/GET/v1/companies/{companyId}/visitor/temporary-upload-url)."
          items:
            type: string
      required:
      - companyName
      - visitorIdentity
      - visitorIdentityType
      - visitorName
      - visitorSurname
    SiteAddressDto:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        county:
          type: string
        postalCode:
          type: string
        country:
          type: string
    UpdateSiteDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phonePrefix:
          type: string
        phone:
          type: string
        photo:
          type: string
        address:
          $ref: "#/components/schemas/SiteAddressDto"
        parentId:
          type: string
          format: uuid
        childrenIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - name
    CustodyDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether evidence is held in custody before release.
        duration:
          $ref: "#/components/schemas/DurationDto"
          description: Custody duration when custody is enabled.
      required:
      - enabled
    DurationDto:
      type: object
      properties:
        amount:
          type: integer
          format: int32
          description: Positive duration amount.
          minimum: 1
        unit:
          type: string
          description: Time unit for the duration.
          enum:
          - DAYS
          - MONTHS
          - YEARS
      required:
      - amount
      - unit
    PeriodicDto:
      type: object
      properties:
        startFirstDayOfMonth:
          type: boolean
          description: "When true, periodic cycles align to the first day of the month."
        periodicity:
          type: integer
          format: int32
          description: Number of units between renewals (minimum 1).
          minimum: 1
        periodicityType:
          type: string
          description: "Unit for periodicity (e.g. days, months)."
          enum:
          - DAYS
          - MONTHS
          - YEARS
      required:
      - periodicity
      - periodicityType
      - startFirstDayOfMonth
    RulesCondition:
      type: object
      properties:
        activity:
          type: string
          description: Rule key or expression for activity scope.
        site:
          type: string
          description: Rule key or expression for site scope.
        contract:
          type: string
          description: Rule key or expression for contract scope.
        project:
          type: string
          description: Rule key or expression for project scope.
        contractor:
          type: string
          description: Rule key or expression for contractor scope.
        risk:
          type: string
          description: Rule key or expression for risk scope.
        employeeType:
          type: string
          description: Rule key or expression for employee type.
        vehicleType:
          type: string
          description: Rule key or expression for vehicle type.
        equipmentType:
          type: string
          description: Rule key or expression for equipment type.
        productType:
          type: string
          description: Rule key or expression for product type.
        euCategory:
          type: string
          description: EU category filter when applicable.
          enum:
          - NATIONAL_COMPANY
          - EU_COMPANY
          - NON_EU_COMPANY
    UpdateRequirementDto:
      type: object
      properties:
        name:
          type: string
          description: Display name of the requirement.
          minLength: 1
        subject:
          type: string
          description: Subject the requirement applies to (resource type).
          enum:
          - EMPLOYEE
          - EQUIPMENT
          - CONTRACTOR
          - VEHICLE
          - PRODUCT
          - VISITOR
        multipleInstanceRequest:
          type: string
          description: How multiple requirement instances are created for the subject.
          enum:
          - NONE
          - SITE_SPECIFIC
          - CONTRACT_SPECIFIC
          - PROJECT_SPECIFIC
        appliedTo:
          type: string
          description: Contract scope the requirement applies to.
          enum:
          - ALL_CONTRACTORS
          - ONLY_PRINCIPAL_CONTRACTORS
          - ONLY_SUBCONTRACTORS
        description:
          type: string
          description: Longer description shown to users.
        evidenceType:
          type: string
          description: "Evidence type (upload, agreement, etc.)."
          enum:
          - UPLOAD
          - AGREEMENT
          - TRAINING
          - ACCIDENT_REPORT
        templateFile:
          type: string
          description: Object storage key for a template file; blank clears the template
            when permitted.
        critical:
          type: boolean
          description: Marks the requirement as critical for compliance.
        enableDoesNotApply:
          type: boolean
          description: Allows submitters to mark the requirement as not applicable.
        expirationType:
          type: string
          description: "How the requirement expires (none, periodic, specific date,\
            \ etc.)."
          enum:
          - NONE
          - PERIODIC
          - SPECIFIC_DATE
        periodicExpiration:
          $ref: "#/components/schemas/PeriodicDto"
          description: Periodic renewal settings when expiration type is periodic.
        gracePeriod:
          type: integer
          format: int32
          description: "Grace period after expiration before non-compliance, in days."
          minimum: 0
        canBeSetInFuture:
          type: boolean
          description: Whether issue dates may be set in the future.
        custody:
          $ref: "#/components/schemas/CustodyDto"
          description: Custody settings for evidence retention.
        rules:
          type: array
          description: "Rule rows evaluated to scope the requirement (sites, activities,\
            \ etc.)."
          items:
            $ref: "#/components/schemas/RulesCondition"
        acceptanceCriteria:
          type: array
          description: Acceptance criteria labels or keys shown to reviewers.
          items:
            type: string
        lastEvidenceStatusDto:
          type: string
          description: "When evidence already exists, controls whether linked evidences\
            \ are rejected on breaking changes."
          enum:
          - REJECT
          - DO_NOT_REJECT
        standardRequirementId:
          type: string
          format: uuid
          description: Optional link to a standard catalogue requirement.
        relationship:
          type: string
          format: uuid
          description: Optional related requirement id for grouped logic.
        validableByEmail:
          type: boolean
        validableByEmailUserIds:
          type: array
          description: Full desired email-validation recipient list. The backend diffs
            against the currently stored set to determine inserts and deletes.
          items:
            type: string
        paymentRequired:
          type: boolean
          description: Whether the requirement must be fulfilled for payment authorization.
        clientApprovalResourceAssignments:
          type: boolean
          description: Whether this requirement must be reviewed on the resource assignment
            review page when auto approvals are disabled.
        signatureRequired:
          type: boolean
          description: "Whether accepting this agreement requires a handwritten signature.\
            \ Only meaningful when evidenceType is AGREEMENT, the subject is a person\
            \ who can sign, and the company holds the Signable Agreements add-on.\
            \ Asking for it on a subject that is nobody rejects the creation, and\
            \ clears the flag on an update."
        enable:
          type: boolean
          description: "When true, enables the requirement on edit, when false, keeps\
            \ it disabled; default is false to avoid unintended activation. Only can\
            \ be send when the requirement is currently disabled."
        trainingCourseId:
          type: string
          format: uuid
          description: Training course to link to this requirement. Only valid when
            evidenceType is TRAINING.
        holdingShareScope:
          type: string
          enum:
          - INDEPENDENT
          - ALL_COMPANIES
          - SPECIFIC_COMPANIES
        holdingSharedCompanyIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - acceptanceCriteria
      - appliedTo
      - canBeSetInFuture
      - critical
      - custody
      - enableDoesNotApply
      - evidenceType
      - expirationType
      - multipleInstanceRequest
      - name
      - rules
      - subject
    IdValue:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    RejectSubmissionDto:
      type: object
      properties:
        reason:
          type: string
          description: Optional rejection reason.
        rejectedAcceptanceCriteria:
