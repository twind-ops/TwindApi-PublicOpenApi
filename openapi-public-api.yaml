  /v1/companies/{companyId}/contracts/{contractId}:
    delete:
      tags:
      - Companies and contracts
      summary: Delete a contract
      description: "Soft deletes the contract (contract is marked as deleted). Business\
        \ rules: there is no requirement to clear engagements or unassign resources\
        \ first; the API soft-deletes the contract together with descendant subcontracts,\
        \ engagements, assignments, and related compliance data. This is not a “close”\
        \ or “finalize” step—there is no separate REST action for that; date-based\
        \ contract expiry is handled elsewhere and is independent of delete. To remove\
        \ only a subcontract, call this with the subcontract’s contract ID."
      operationId: deleteContract
      parameters:
      - name: companyId
        in: path
        description: Client company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        description: Contract ID (subcontract ID to remove a subcontract)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
          content: {}
        "400":
          description: Contract missing or not owned by this client company
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    patch:
      tags:
      - Companies and contracts
      summary: Update contract
      description: "Partially updates a contract. The path **`companyId`** is the\
        \ **client** company; **`contractId`** identifies either the **main** contract\
        \ or a **subcontract** in its hierarchy. Body:** omit fields you do not want\
        \ to change. **Main contract:** optional **name**, **managerId** (internal\
        \ user id), validity **dateFrom** / **dateTo**, and optional **subcontracting**\
        \ policy. **Subcontract:** only **dateFrom** and **dateTo**; **name**, **managerId**,\
        \ and **subcontracting** are not accepted. When **dateFrom** or **dateTo**\
        \ change, values must fall within the allowed window for that contract. The\
        \ effective end date drives **expired** / **reinstated** lifecycle transitions\
        \ relative to the company calendar."
      operationId: updateContract
      parameters:
      - name: companyId
        in: path
        description: Client company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        description: Contract or subcontract ID to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractDto"
        required: true
      responses:
        "204":
          description: Contract updated successfully
          content: {}
        "400":
          description: Validation or business rule violation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Contract not found for this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
