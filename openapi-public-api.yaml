      summary: Get payment authorization status by company
      description: "Returns one row per contractor with at least one active contract\
        \ with the client, with their aggregated payment authorization status. Works\
        \ in both calculation modes; the mode in effect is returned in each row's\
        \ `calculationMode` field. **Allowed sort fields:** `contractor_name` (default).\
        \ **Sort format:** `?sort=field,direction` (e.g. `?sort=contractor_name,asc`)."
      operationId: getByCompany
      parameters:
      - name: clientId
        in: path
        description: Client company ID. UUID of the client company. Obtain it from
          `GET /v1/users/me/companies` (field `companyId`).
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "contractor_name,ASC"
          items:
            type: string
      - name: paymentStatus
        in: query
        description: Filter by aggregated payment status
        required: false
        schema:
          type: string
          enum:
          - AUTHORIZED
          - NOT_AUTHORIZED
      - name: contractorIds
        in: query
        description: "Filter by contractor company IDs. Obtain them from the `by-company`\
          \ list response (field `contractor.id`) or from `GET /v1/companies/{companyId}/contracts/my-contractors`\
          \ (field `id`)."
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: contractIds
        in: query
        description: Filter contractors to those with at least one matching contract.
          Obtain contract IDs from the `by-contract` list response (field `contract.id`).
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: siteIds
        in: query
        description: "Filter by site IDs (matches contract scope including child sites).\
          \ Obtain them from `GET /v1/companies/{companyId}/sites` (field `id`)."
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: activityIds
        in: query
        description: "Filter by activity IDs (contract has an engagement on one of\
          \ these activities). Obtain them from `GET /v1/companies/{companyId}/activities`\
          \ (field `id`)."
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: dateFrom
        in: query
        description: Contract date range start (contract.dateFrom >= dateFrom)
        required: false
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        description: Contract date range end (contract.dateTo <= dateTo)
        required: false
        schema:
          type: string
          format: date
      - name: managerIds
        in: query
        description: "Filter by contract manager user IDs. Obtain them from `GET /v1/companies/{companyId}/users`\
          \ (field `id`)."
        required: false
        schema:
          type: array
          items:
            type: string
      - name: maxContractsPerContractor
        in: query
        description: "Maximum number of contracts to return per contractor. When omitted,\
