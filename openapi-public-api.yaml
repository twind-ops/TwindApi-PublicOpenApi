      properties:
        id:
          type: string
        client:
          $ref: "#/components/schemas/GetAccessControlClient"
        contractor:
          $ref: "#/components/schemas/GetAccessControlContractor"
        resource:
          oneOf:
          - $ref: "#/components/schemas/Employee"
          - $ref: "#/components/schemas/Equipment"
          - $ref: "#/components/schemas/Product"
          - $ref: "#/components/schemas/Vehicle"
        site:
          $ref: "#/components/schemas/Site"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        risks:
          type: array
          items:
            $ref: "#/components/schemas/Risk"
        status:
          type: string
          enum:
          - ALLOWED
          - PARTIALLY_ALLOWED
          - NOT_ALLOWED
        endOfAccess:
          type: string
          format: date
        issues:
          type: array
          items:
            $ref: "#/components/schemas/RequirementIssues"
        issueRequirements:
          type: array
          items:
            $ref: "#/components/schemas/IssueRequirement"
        blockingAncestorContractors:
          type: array
          items:
            $ref: "#/components/schemas/BlockingContractor"
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/Contract"
        temporaryAuthorization:
          $ref: "#/components/schemas/TemporaryAuthorizationSummary"
        activeEntry:
          $ref: "#/components/schemas/GetAccessControlActiveEntry"
        activeEntriesInBranch:
          type: array
          items:
            $ref: "#/components/schemas/GetAccessControlActiveEntry"
      required:
      - activities
      - blockingAncestorContractors
      - client
      - contractor
      - contracts
      - id
      - issueRequirements
      - issues
      - resource
      - risks
      - site
      - status
    PageResponseGetAccessControlResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/GetAccessControlResponse"
        page:
          $ref: "#/components/schemas/PageData"
      required:
      - content
      - page
    Risk:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    PageResponsePaymentAuthorizationHistoryEventDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAuthorizationHistoryEventDto"
        page:
          $ref: "#/components/schemas/PageData"
      required:
      - content
      - page
    PaymentAuthorizationHistoryEventDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the event happened.
        eventName:
          type: string
          description: "Type of configuration event: `system_product.created` (Payment\
            \ Authorization product activated for the client), `system_product.updated`\
            \ (configuration changed, e.g. calculation mode) or `system_product.deleted`\
            \ (product deactivated)."
        calculationMode:
          type: string
          description: Calculation mode set by this event. Null when the event did
            not carry a calculation mode (e.g. a product activation or deactivation
            without explicit configuration).
          enum:
          - INDIVIDUAL
          - SUBCONTRACTING_CHAIN
        actor:
          $ref: "#/components/schemas/Actor"
          description: The user who performed the change.
      required:
      - actor
      - eventName
      - timestamp
    ContractorPaymentAuthorizationContractRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Contract id. Pass it as the `contractId` path variable of\
            \ `GET .../payment-authorization/by-contract/{contractId}`, or as the\
            \ `contractIds` filter."
        name:
          type: string
        level:
          type: integer
          format: int32
        paymentStatus:
          type: string
          enum:
          - AUTHORIZED
          - NOT_AUTHORIZED
      required:
      - id
      - level
      - name
      - paymentStatus
    ContractorPaymentAuthorizationDetailDto:
      type: object
      properties:
        contractor:
          $ref: "#/components/schemas/ContractorRef"
        paymentStatus:
          type: string
          enum:
          - AUTHORIZED
          - NOT_AUTHORIZED
        calculationMode:
          type: string
          enum:
          - INDIVIDUAL
          - SUBCONTRACTING_CHAIN
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractorPaymentAuthorizationContractRef"
        blockingRequirements:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAuthorizationIssueDto"
      required:
      - blockingRequirements
      - calculationMode
      - contractor
      - contracts
      - paymentStatus
    ContractorRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Contractor company id.
        name:
          type: string
          description: Contractor company name.
        taxId:
          type: string
          description: Contractor company tax id when available.
      required:
      - id
      - name
    PaymentAuthorizationIssueDto:
      type: object
      properties:
        requirementInstanceId:
          type: string
          format: uuid
          description: "Id of the requirement instance blocking payment. Use it with\
            \ `GET /v1/companies/{companyId}/requirement-instances/{instanceId}` (Requirements\
            \ API) to obtain the full requirement configuration and evidence detail.\
            \ The `companyId` path variable is the contractor company that owns the\
            \ requirement instance: read it from this issue's `contractor.id` (in\
            \ Subcontracting Chain mode it may differ from the enclosing detail's\
            \ contractor); it also equals `subject.id` when the subject is the contractor\
            \ company itself."
        requirement:
          $ref: "#/components/schemas/RequirementRef"
          description: The requirement (id and name) that is blocking payment.
        status:
          type: string
          description: "Evidence status of the requirement instance. Only blocking\
            \ statuses appear here: PENDING_UPLOAD, PENDING_REVIEW, REJECTED, EXPIRED\
            \ or PENDING_VALIDITY. Satisfied statuses (APPROVED, UNDER_GRACE_PERIOD)\
            \ never appear, since such an instance no longer blocks payment."
          enum:
          - APPROVED
          - REJECTED
          - PENDING_REVIEW
          - PENDING_UPLOAD
          - UNDER_GRACE_PERIOD
          - EXPIRED
          - PENDING_VALIDITY
        subject:
          $ref: "#/components/schemas/SubjectRef"
          description: "The specific subject failing the requirement: contractor company,\
            \ employee, vehicle, equipment or product."
        contractor:
          $ref: "#/components/schemas/ContractorRef"
          description: The contractor company that owns this failing requirement.
            In Individual mode it always equals the enclosing detail's contractor;
            in Subcontracting Chain mode it may be another contractor in the chain
            contributing to the block.
      required:
      - contractor
      - requirement
      - requirementInstanceId
      - status
      - subject
    RequirementRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Requirement id (the requirement definition). To dereference\
            \ the blocking instance use `requirementInstanceId` against the Requirements\
            \ API, not this id."
        name:
          type: string
          description: Requirement name.
      required:
      - id
      - name
    SubjectRef:
      type: object
      properties:
        type:
          type: string
          description: "Subject type: CONTRACTOR (the contractor company itself),\
            \ EMPLOYEE, VEHICLE, EQUIPMENT or PRODUCT."
          enum:
          - EMPLOYEE
          - EQUIPMENT
          - CONTRACTOR
          - VEHICLE
          - PRODUCT
          - VISITOR
        id:
          type: string
          format: uuid
          description: "Subject id. Its source depends on `type`: when CONTRACTOR\
            \ it equals the contractor company id (`contractor.id` of the enclosing\
            \ detail response); when EMPLOYEE, VEHICLE, EQUIPMENT or PRODUCT it is\
            \ the resource id from the matching resource list endpoint (`GET /v1/companies/{companyId}/employees|vehicles|equipment|products`,\
            \ field `id`), which requires the corresponding resource product to be\
            \ subscribed in addition to Payment Authorization."
        name:
          type: string
          description: Subject display name.
        identifier:
          type: string
          description: "Human-readable identifier of the subject when available, e.g.\
            \ an employee's national id or a vehicle's plate number."
      required:
      - id
      - name
      - type
    PageResponsePaymentAuthorizationByContractRowDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAuthorizationByContractRowDto"
        page:
          $ref: "#/components/schemas/PageData"
      required:
      - content
      - page
    PaymentAuthorizationByContractActivityRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Activity id. Pass it as an `activityIds` filter value. Obtain\
            \ the full catalogue from `GET /v1/companies/{companyId}/activities` (field\
            \ `id`)."
        name:
          type: string
      required:
      - id
      - name
    PaymentAuthorizationByContractContractRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Contract id. Pass it as the `contractId` path variable of\
            \ `GET .../payment-authorization/by-contract/{contractId}`, or as the\
            \ `contractIds` filter."
        name:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        level:
          type: integer
          format: int32
        sites:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAuthorizationByContractSiteRef"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAuthorizationByContractActivityRef"
        sitesAndActivities:
          type: array
          description: "Sites engaged on this contract, each carrying only the activities\
            \ actually engaged at that site, with their effective activity type. Supersedes\
            \ the flat `sites` and `activities` pair, which lists the contract's sites\
            \ and its activities independently and so cannot express which activity\
            \ happens at which site. Contains the same sites as `sites`, in the same\
            \ order, without the site level and breadcrumb — read those from `sites`\
            \ when needed. `type` is the effective type: SPECIAL_WORK only when the\
            \ owning client company has the Special Works add-on active, COMMON otherwise\
            \ regardless of how the activity is stored."
          items:
            $ref: "#/components/schemas/PaymentAuthorizationByContractSiteActivitiesRef"
      required:
      - activities
      - id
      - level
      - name
      - sites
    PaymentAuthorizationByContractContractorRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Contractor company id. Pass it as the `contractorId` path\
            \ variable of `GET .../payment-authorization/contractors/{contractorId}`,\
            \ or as the `contractorIds` filter. It is also the `companyId` for the\
            \ Requirements API dereference of blocking requirement instances."
        name:
          type: string
        taxId:
          type: string
      required:
      - id
      - name
    PaymentAuthorizationByContractRowDto:
      type: object
      properties:
        contractor:
          $ref: "#/components/schemas/PaymentAuthorizationByContractContractorRef"
          description: The contractor company holding the contract.
        contract:
          $ref: "#/components/schemas/PaymentAuthorizationByContractContractRef"
          description: The contract this row's payment status is calculated for.
        paymentStatus:
          type: string
          description: "Payment authorization status of this contractor-contract pair.\
            \ AUTHORIZED when every payment-required requirement is satisfied (in\
            \ Subcontracting Chain mode, across the whole contracting chain of the\
            \ contract); NOT_AUTHORIZED otherwise. Use `GET .../payment-authorization/by-contract/{contractId}`\
            \ to obtain the blocking requirement issues behind a NOT_AUTHORIZED status."
          enum:
          - AUTHORIZED
          - NOT_AUTHORIZED
        calculationMode:
          type: string
          description: "Calculation mode used for this row's status: INDIVIDUAL or\
            \ SUBCONTRACTING_CHAIN. Read the client's configured mode from `GET .../payment-authorization/config`."
          enum:
          - INDIVIDUAL
          - SUBCONTRACTING_CHAIN
      required:
      - calculationMode
      - contract
      - contractor
      - paymentStatus
    PaymentAuthorizationByContractSiteActivitiesRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Site id. Matches the `id` of the same site in `sites`.
        name:
          type: string
          description: Site name.
        activities:
          type: array
          description: "Activities engaged at this site, each carrying its effective\
            \ type."
          items:
            $ref: "#/components/schemas/Activity"
      required:
      - activities
      - id
      - name
    PaymentAuthorizationByContractSiteRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Site id. Pass it as a `siteIds` filter value. Obtain the full\
            \ catalogue from `GET /v1/companies/{companyId}/sites` (field `id`)."
        name:
          type: string
        level:
          type: string
          enum:
          - BUSINESS
          - SITE_GROUP
          - SITE
          - ZONE
          - AREA
        breadcrumb:
          type: array
          items:
            $ref: "#/components/schemas/SiteNodeItem"
      required:
      - breadcrumb
      - id
      - level
      - name
    PaymentAuthorizationByContractChainContractRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Contract id. Pass it as the `contractId` path variable of\
            \ `GET .../payment-authorization/by-contract/{contractId}`."
        name:
          type: string
        level:
          type: integer
          format: int32
          description: "Subcontracting level: 0 = Main contract, >=1 = Subcontract\
            \ level N."
        contractor:
          $ref: "#/components/schemas/PaymentAuthorizationByContractContractorRef"
          description: "The contractor on this contract. In Subcontracting Chain mode\
            \ the chain spans multiple contractors, so each contributing contract\
            \ carries its own."
        paymentStatus:
          type: string
          enum:
          - AUTHORIZED
          - NOT_AUTHORIZED
      required:
      - contractor
      - id
      - level
      - name
      - paymentStatus
    PaymentAuthorizationContractDetailDto:
      type: object
      properties:
        contractor:
          $ref: "#/components/schemas/PaymentAuthorizationByContractContractorRef"
          description: The contractor company holding the contract.
        contract:
          $ref: "#/components/schemas/PaymentAuthorizationByContractContractRef"
          description: The contract this detail's payment status is calculated for.
        paymentStatus:
          type: string
          description: "Payment authorization status of this contractor-contract pair.\
            \ AUTHORIZED when every payment-required requirement is satisfied (in\
            \ Subcontracting Chain mode, across the whole contracting chain of the\
            \ contract); NOT_AUTHORIZED otherwise."
          enum:
          - AUTHORIZED
          - NOT_AUTHORIZED
        issueCount:
          type: integer
          format: int32
          description: Total number of blocking requirement issues. Always 0 when
            `paymentStatus` is AUTHORIZED.
        issues:
          type: array
          description: The requirement issues blocking payment on this contract. Empty
            when `paymentStatus` is AUTHORIZED. In Subcontracting Chain mode the list
            may include issues owned by other contractors in the chain (see each issue's
            `contractor`). Dereference each issue's `requirementInstanceId` via the
            Requirements API to obtain the full requirement and evidence detail.
          items:
            $ref: "#/components/schemas/PaymentAuthorizationIssueDto"
        calculationMode:
          type: string
          description: "Calculation mode used for this detail's status: INDIVIDUAL\
            \ or SUBCONTRACTING_CHAIN. Read the client's configured mode from `GET\
            \ .../payment-authorization/config`."
          enum:
          - INDIVIDUAL
          - SUBCONTRACTING_CHAIN
        contracts:
          type: array
          description: "The contracts contributing to this status. In INDIVIDUAL mode\
            \ this is the queried contract only; in SUBCONTRACTING_CHAIN mode it includes\
            \ every contract in the subcontracting chain, each with its own contractor\
            \ and payment status."
          items:
            $ref: "#/components/schemas/PaymentAuthorizationByContractChainContractRef"
      required:
      - calculationMode
      - contract
      - contractor
      - contracts
      - issueCount
      - issues
      - paymentStatus
    ContractRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Contract id. Pass it as the `contractId` path variable of\
            \ `GET .../payment-authorization/by-contract/{contractId}`, or as the\
            \ `contractIds` filter."
        name:
          type: string
      required:
      - id
      - name
    PageResponsePaymentAuthorizationByCompanyRowDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAuthorizationByCompanyRowDto"
        page:
          $ref: "#/components/schemas/PageData"
      required:
      - content
      - page
    PaymentAuthorizationByCompanyRowDto:
      type: object
      properties:
        contractor:
          $ref: "#/components/schemas/ContractorRef"
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractRef"
        totalContractsCount:
          type: integer
          format: int32
        paymentStatus:
          type: string
          enum:
          - AUTHORIZED
          - NOT_AUTHORIZED
        calculationMode:
          type: string
          enum:
          - INDIVIDUAL
          - SUBCONTRACTING_CHAIN
      required:
      - calculationMode
      - contractor
      - contracts
      - paymentStatus
      - totalContractsCount
