openapi: 3.1.0
info:
  title: Public API
  description: |-
    API for external systems to integrate with Twind using public API keys.
    Additional products may extend this document over time.

    ## Authentication

    Use the `X-Api-Key` header with your public API key.
  contact:
    name: Twind Support
    email: support@twind.com
  version: "1.0"
servers:
- url: "https://{host}/api"
  description: Twind API
  variables:
    host:
      description: "Environment host: production or development"
      default: app.twind.io
      enum:
      - app.twind.io
      - app.twinddev.com
security:
- ApiKeyAuth: []
tags:
- name: User
  description: "Current authenticated user, profile, permissions, and company associations."
- name: Companies
  description: "Companies in the network: company details and summary, client companies\
    \ for a contractor, contractors with active contracts, and member user lists."
- name: Lookups
  description: "Reference data for filtering: countries, languages, sites, and activities."
- name: Resource lists
  description: "Read-only resource lists by company (employees, vehicles, equipment).\
    \ Full CRUD is in the Resources group."
- name: Assigned resources
  description: "Resources currently assigned to contract sites, from both client and\
    \ contractor perspectives."
- name: Contract listings
  description: "Read-only views of active contracts: contracts with clients, and contract\
    \ details with sites and activities."
- name: Employees
  description: "CRUD operations for contractor employees, employee count, and type\
    \ classifications."
- name: Vehicles
  description: CRUD operations for contractor vehicles and type catalogs (standard
    and client-specific).
- name: Equipment
  description: CRUD operations for contractor equipment and type catalogs (standard
    and client-specific).
- name: Assignments
  description: "Site details, resource assignments to contract sites, and risk assignments."
- name: Visitors
  description: "Visitor records: create, read, update; upload URL, plate numbers,\
    \ and visitor company lists."
- name: Visit register
  description: "Visitor sign-in and sign-out log: list, create, read, and update visit\
    \ entries."
- name: Access register
  description: "Physical access entry and exit log: list, create, record exit, and\
    \ read entries."
- name: Temporary authorizations
  description: "Temporary site access authorizations: list, create, read, update,\
    \ delete; search by name and authorizer."
- name: Access status
  description: Access control status for individual resources and contractor/client-wide
    views.
- name: Configuration
  description: "Requirement definitions: CRUD, template upload URL, statistics, and\
    \ enable/disable controls."
- name: Instances
  description: "Requirement instances (active state per engagement): read, logs, eligible\
    \ resources, contractor and client views."
- name: Submissions
  description: "Submission and review: file upload URL, agreement submission, approve,\
    \ reject, and requirement instance matching."
- name: Company
  description: "Company profile: update details, create contractors, and subcontractor\
    \ hierarchy."
- name: Sites
  description: "Site management: create, read, update, and contractor views including\
    \ hierarchy."
- name: Contracts
  description: "Contract lifecycle: create, update, soft-delete; sites and activities\
    \ are managed through the contract body; resource and hierarchy tree views; and\
    \ contractor contract lists."
- name: Subcontracts
  description: "Subcontracting relationships: direct creation, requests (list, create,\
    \ approve, reject), contractor view, and subcontracts at a contract site."
- name: Document hub
  description: "Document Hub: create, read, update, and delete company documents;\
    \ draft lifecycle (create drafts and finalize them); and autocomplete helpers\
    \ for subject and document-name filters."
- name: Contractor status
  description: |-
    List contractors with their aggregated payment authorization status, and drill into a contractor to see the requirements blocking payment.

    Supports both calculation modes (Individual and Subcontracting Chain) following the same business rules as the Payment Authorization module.

    - **Payment status by contractor**: List contractors with aggregated payment authorization status (paginated, filterable by contractor/company, payment status, contract, site and activity)
    - **Contractor detail**: Aggregated status for a single contractor plus the blocking requirement instances
    - **Resolving blocking requirements**: Each blocking requirement carries a `requirementInstanceId`. Dereference it via `GET /v1/companies/{companyId}/requirement-instances/{instanceId}` (requires the Requirements API product).
- name: Contract status
  description: |-
    List contracts with the contractor's payment authorization status per contract, and drill into a contract to see the blocking requirement issues.

    - **Payment status by contract**: List contracts with the contractor's payment authorization status per contract (paginated, filterable by contractor/company, contract, site, activity and payment status)
    - **Contract detail**: Payment authorization status and blocking requirement issues for a contractor on a specific contract
    - **Resolving blocking requirements**: Each issue carries a `requirementInstanceId`. Dereference it via `GET /v1/companies/{companyId}/requirement-instances/{instanceId}` (requires the Requirements API product).
- name: Calculation mode
  description: |-
    Read and manage the client's calculation mode (Individual or Subcontracting Chain), and review its change history.

    - **Configuration**: Read the current calculation mode, and update it (updating requires write permission)
    - **History**: List the configuration change history — product activations, deactivations and calculation mode changes
paths:
  /v1/users/me:
    get:
      tags:
      - User
      summary: Get current user information
      description: "Retrieves detailed information about the currently authenticated\
        \ user, including their profile, permissions, company associations and userSettings\
        \ (e.g. mobile unattended mode)."
      operationId: me
      parameters:
      - name: companyId
        in: query
        description: Optional company ID to get permissions for (only applicable for
          Global Admins)
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully retrieved user information
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDetails"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDetails"
  /v1/users/me/companies:
    get:
      tags:
      - User
      summary: Get current user's companies
      description: Retrieves the list of companies that the currently authenticated
        user has access to.
      operationId: meCompanies
      responses:
        "200":
          description: Successfully retrieved user's companies
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCompanyInfo"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCompanyInfo"
  /v1/companies/{id}/summary:
    get:
      tags:
      - Companies
      summary: Get company by id
      description: Returns summary of company details for the given id.
      operationId: findCompanySummary
      parameters:
      - name: id
        in: path
        description: Company id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully retrieved company
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanySummaryDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Company not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{companyId}/contracts/my-contractors:
    get:
      tags:
      - Companies
      summary: List contractors associated with the client company
      description: "Returns distinct contractor companies that have at least one contract\
        \ where the given company is the client. **Search (`q`):** matched against\
        \ contractor name, email, and tax ID (partial, normalized for tax ID). **Filters:**\
        \ `activeContractsOnly` restricts to non-expired contracts. `selected` limits\
        \ results to the given contractor IDs (combined with `q` using OR when both\
        \ are present). `contractorIds` hard-filters results to contractors whose\
        \ ID appears in the list (applied before OR logic)."
      operationId: mySuppliers
      parameters:
      - name: companyId
        in: path
        description: Client company id
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: "Text search on contractor name, email, or tax ID (optional;\
          \ combined with `selected` when both are set)"
        required: false
        schema:
          type: string
      - name: activeContractsOnly
        in: query
        description: "When true, only contractors with at least one non-expired contract"
        required: false
        schema:
          type: boolean
      - name: selected
        in: query
        description: Optional list of contractor company IDs to include (OR with `q`
          when both are present)
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: contractorIds
        in: query
        description: Optional list of contractor company IDs to filter contracts by
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: contractId
        in: query
        description: Optional contract ID to restrict results to its contractor
        required: false
        schema:
          type: string
          format: uuid
      - name: siteId
        in: query
        description: Optional site ID (L3) to restrict results to contractors engaged
          there
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved contractors
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseMyContractor"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{contractorId}/clients:
    get:
      tags:
      - Companies
      summary: List client companies
      description: "Retrieves paginated list of client companies for a contractor.\
        \ Use this endpoint to obtain client IDs for filtering in access-control endpoints.\
        \ **Selection:** `selected` restricts to given client company ids, unioned\
        \ with `q` when both are present."
      operationId: findClients
      parameters:
      - name: contractorId
        in: path
        description: Contractor company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search query to filter clients by name
        required: false
        schema:
          type: string
      - name: selected
        in: query
        description: "Optional: client company ids that must stay in the result even\
          \ when they do not match `q`. Combined with `q` as a union. Without `q`\
          \ it narrows the result to these ids."
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved clients list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCompanyClientData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCompanyClientData"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelCompanyClientData"
  /v1/companies/{companyId}/users:
    get:
      tags:
      - Companies
      summary: List company users
      description: "Returns a paginated list of users for the company. Supports optional\
        \ search (q), role filters, and selected user IDs."
      operationId: findUsers
      parameters:
      - name: companyId
        in: path
        description: Company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search text (partial match)
        required: false
        schema:
          type: string
      - name: role
        in: query
        description: Filter by a single role ID
        required: false
        schema:
          type: string
          format: uuid
      - name: roles
        in: query
        description: Filter by role IDs
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: selected
        in: query
        description: Optional subset of user IDs to include
        required: false
        schema:
          type: array
          items:
            type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/countries:
    get:
      tags:
      - Lookups
      summary: List countries
      description: Paginated countries catalog. Filter by partial **name** match.
      operationId: findAll_10
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved countries
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelSystemCountry"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/languages:
    get:
      tags:
      - Lookups
      summary: List languages
      description: Paginated languages catalog. Filter by partial **name** or **code**
        match.
      operationId: findAll_8
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved languages
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelSystemLanguage"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{companyId}/activities:
    get:
      tags:
      - Lookups
      summary: List client activities
      description: "Returns a paginated list of activities defined for the company\
        \ (client configuration). Optionally filter by `type` (SPECIAL_WORK or COMMON).\
        \ `type` reflects the company's current Special Works entitlement: activities\
        \ stored as SPECIAL_WORK are reported as COMMON, and excluded from a `type=SPECIAL_WORK`\
        \ filter, if the Special Works add-on is not enabled for this company. **Allowed\
        \ sort fields:** `name` (default), `description`, `createdAt`, `type`, `selected`.\
        \ **Sort format:** `sort=name,asc` (default: name ascending). Sorting by `type`\
        \ falls back to `name` ascending, regardless of the requested direction, once\
        \ the Special Works add-on is disabled for this company (every activity is\
        \ reported as COMMON, so there is no type order left to apply). Sorting by\
        \ `selected` pins the ids passed in `selected` to the top of the page (`sort=selected,desc`\
        \ pushes them to the bottom instead), each block ordered by `name` ascending;\
        \ it falls back to `name` ascending when `selected` is omitted or empty. With\
        \ `sort=selected` and no search text, `selected` ids only order the result\
        \ — the full catalog is returned; otherwise `selected` filters as before."
      operationId: findAll_5
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: selected
        in: query
        description: "Optional: activity ids that must stay in the result even when\
          \ they do not match `q`. Combined with `q` as a union, never widening the\
          \ company scope; without `q` it narrows the result to these ids. With `sort=selected`\
          \ and no search text, `selected` ids only order the result — the full catalog\
          \ is returned, with these ids pinned to the top."
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: contractIds
        in: query
        description: "Optional: narrow results to activities used by these contracts'\
          \ engagements. Applied as an additional AND filter that takes precedence\
          \ over `selected`: selected ids outside the contract scope are excluded."
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: holdingSharedParent
        in: query
        description: "Optional: return only holding activities when true."
        required: false
        schema:
          type: boolean
      - name: holdingShareScope
        in: query
        description: "Optional (requirement-rule picker, M5-123): return only activities\
          \ eligible for a holding requirement of this scope — i.e. shared with all\
          \ the requirement's target companies. `SPECIFIC_COMPANIES` requires `holdingSharedCompanyIds`.\
          \ Ignored when the holding feature is inactive."
        required: false
        schema:
          type: string
          enum:
          - INDEPENDENT
          - ALL_COMPANIES
          - SPECIFIC_COMPANIES
      - name: holdingSharedCompanyIds
        in: query
        description: "Optional (requirement-rule picker, M5-123): the requirement's\
          \ target companies, used with `holdingShareScope=SPECIFIC_COMPANIES` to\
          \ keep only activities shared with all of them."
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: onlySpecialWork
        in: query
        description: "Optional: return only Special Work activities when true. Returns\
          \ an empty page if the company's Special Works add-on is disabled, since\
          \ no activity is reported as SPECIAL_WORK in that case."
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        description: "Optional: filter by activity type (SPECIAL_WORK or COMMON),\
          \ reflecting the company's current Special Works entitlement."
        required: false
        schema:
          type: string
          enum:
          - COMMON
          - SPECIAL_WORK
      - name: companyId
        in: path
        description: Company ID (client)
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Paged activities
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelActivityDto"
        "401":
          description: "Unauthorized: authentication required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/companies/{id}/assigned-resources:
    get:
      tags:
      - Assigned resources
      summary: List assigned resources (as client)
      description: "Retrieves a paginated list of resources (employees, vehicles,\
        \ equipment) assigned to contracts where the company acts as client. The result\
        \ covers the whole contract tree: direct contractors and any subcontractors\
        \ they have engaged, because subcontracts inherit the head client's id. One\
        \ row per resource. Use this endpoint to obtain resource ids for filtering\
        \ in access-control endpoints or when a lightweight listing is enough. Max\
        \ page size: 100."
      operationId: findAssignedResources
      parameters:
      - name: id
        in: path
        description: Client company ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Search query to filter resources by name
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        description: Filter by a single resource ID. Combined with resourceIds using
          OR — the result is the union of both.
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceType
        in: query
        description: "Filter by resource type (EMPLOYEE, VEHICLE, EQUIPMENT). Deprecated:\
          \ use resourceTypes instead. If both resourceType and resourceTypes are\
          \ provided, they are combined using OR."
        required: false
        schema:
          type: string
      - name: resourceTypes
        in: query
        description: "Filter by resource types (EMPLOYEE, VEHICLE, EQUIPMENT)"
        required: false
        schema:
          type: array
          items:
            type: string
      - name: contractorIds
        in: query
        description: Filter by specific contractor IDs
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: resourceIds
        in: query
        description: Filter by multiple resource IDs. Combined with resourceId using
          OR — the result is the union of both.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved resources list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceBasicData"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceBasicData"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelResourceBasicData"
  /v2/companies/{id}/assigned-resources-detailed/as-client:
    get:
      tags:
      - Assigned resources
      summary: List assigned resources as client
      description: "Retrieves a paginated list of resources assigned to contracts\
        \ where the company acts as client. Each resource carries its per-resource\
        \ attributes plus an 'assignments' array describing every (contract, site)\
        \ pair where that resource is currently deployed. For EMPLOYEE resources,\
        \ each assignment also lists the risks applied at that site. Activities within\
        \ a site are bundled into a single assignment entry. Pagination is per resource.\
        \ Max page size: 100."
      operationId: findAssignedDetailedResources
      parameters:
      - name: id
        in: path
        description: Client company ID
        required: true
        schema:
