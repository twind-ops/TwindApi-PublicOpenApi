          description: Deprecated — use 'sites'. Mutually exclusive with 'sites'.
          items:
            type: string
            format: uuid
        sites:
          type: array
          description: "One or more sites of the parent contract, each with its own\
            \ activities."
          items:
            $ref: "#/components/schemas/SubcontractSiteDtoV2"
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
      - contractorIds
      - dateFrom
      - dateTo
    SubcontractSiteDtoV2:
      type: object
      properties:
        siteId:
          type: string
          format: uuid
        activityIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - activityIds
      - siteId
    ContractClientValidationDto:
      type: object
      description: Client-validation toggles for one resource type on a contract.
      properties:
        resourceType:
          type: string
          enum:
          - EMPLOYEE
          - VEHICLE
          - EQUIPMENT
          - PRODUCT
        clientValidatesAssignments:
          type: boolean
          description: Assignments and modifications of this resource type require
            client validation.
        clientValidatesRemovals:
          type: boolean
          description: Removals of this resource type require client validation.
      required:
      - clientValidatesAssignments
      - clientValidatesRemovals
      - resourceType
    ContractSiteDtoV2:
      type: object
      description: A site assignment with its own activity list and an optional explicit
        scope. The scope is only applicable when the Site Hierarchy product is enabled.
      properties:
        siteId:
          type: string
          format: uuid
          description: Site ID to include in the contract.
        activities:
          type: array
          description: Activities this site covers; must not be empty.
          items:
            type: string
            format: uuid
        scopeSiteIds:
          type: array
          description: Optional explicit scope site IDs. When null the site itself
            is used as the scope. Only applicable when the Site Hierarchy product
            is enabled; ignored otherwise.
          items:
            type: string
            format: uuid
      required:
      - activities
      - siteId
    CreateContractDtoV2:
      type: object
      description: Request body to create a contract. Each site carries its own activity
        list.
      properties:
        contractorId:
          type: string
          format: uuid
          description: Contractor company ID.
        name:
          type: string
          description: Contract name.
          minLength: 1
        dateFrom:
          type: string
          format: date
          description: Contract start date (inclusive).
        dateTo:
          type: string
          format: date
          description: Contract end date (inclusive).
        managerId:
          type: string
          description: Internal manager user ID for the contract.
          minLength: 1
        sites:
          type: array
          description: Sites this contract covers; must not be empty. Each site entry
            must include its own non-empty activity list.
          items:
            $ref: "#/components/schemas/ContractSiteDtoV2"
        subcontracting:
          $ref: "#/components/schemas/SubcontractingDto"
          description: Subcontracting configuration.
        createdAt:
          type: string
          format: date-time
          description: Optional creation timestamp override for migrations.
        properties:
          type: object
          additionalProperties:
            type: string
          description: Optional key-value properties to attach to the contract. Keys
            are part of the `ContractPropertyKey` enum (e.g. `ORDER_CODE`).
        resourceClientValidations:
          type: array
          description: Optional per-resource-type client-validation settings (Approval
            of Resource Assignments product). Each entry sets the pair for its resource
            type; both booleans false stores no row (the no-client-validation default).
            Including this field with entries requires the RESOURCE_ASSIGNMENT_APPROVAL_WRITE
            permission (403 otherwise) and is only applied while the product is active
            for the client company; an empty list is a no-op and needs no extra permission.
          items:
            $ref: "#/components/schemas/ContractClientValidationDto"
      required:
      - contractorId
      - dateFrom
      - dateTo
      - managerId
      - name
      - sites
      - subcontracting
    SubcontractingDto:
      type: object
      description: Subcontracting policy for the contract.
      properties:
        allowed:
          type: boolean
          description: Whether subcontracting is allowed under this contract.
        onlyClientAllowed:
          type: boolean
          description: "When true, only the client may create or authorize subcontractors."
        maxLevel:
          type: integer
          format: int32
          description: Maximum subcontract depth when allowed.
        needsAuthorization:
          type: boolean
          description: Whether subcontract creation requires client authorization.
      required:
      - allowed
