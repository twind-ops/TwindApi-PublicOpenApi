          items:
            type: string
            format: uuid
        issueDate:
          type: string
          format: date
          description: Document date of issue for the approved submission.
          example: 2025-03-25
        expirationDate:
          type: string
          format: date
          description: Computed or overridden expiration date for the submission.
          example: 2026-03-25
      required:
      - issueDate
    UpdateDocumentDto:
      type: object
      properties:
        name:
          type: string
        subjectType:
          type: string
