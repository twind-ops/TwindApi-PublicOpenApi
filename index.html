<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Twind API Documentation</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="guides-data.js"></script>
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
            <span>Twind API</span>
          </div>
          <button class="collapse-btn" onclick="toggleSidebar()" title="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>

        <nav class="sidebar-nav">
          <!-- API Reference -->
          <a class="nav-item active" id="nav-api" onclick="showSection('api')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>API Reference</span>
          </a>

          <!-- Guides -->
          <a class="nav-item" id="nav-guides" onclick="showSection('guides')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>Guides</span>
          </a>
          <div class="nav-subitems" id="nav-guides-subitems">
            <!-- Generated dynamically from guides-data.js -->
          </div>
        </nav>
      </aside>

      <main class="content">
        <div id="api-container" class="visible"></div>
        <div id="guides-container">
          <div class="guides-wrapper">
            <div class="guides-header">
              <h1>Guides</h1>
              <p>Step-by-step tutorials to help you get started with the Twind API.</p>
            </div>
            <div id="guides-list" class="guides-list"></div>
          </div>
        </div>
        <div id="guide-content-container">
          <div class="guide-wrapper">
            <a class="back-link" href="#" onclick="showSection('guides'); return false;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              Back to Guides
            </a>
            <div id="guide-content" class="guide-content"></div>
          </div>
        </div>
      </main>
    </div>

    <script>
      // Initialize Scalar API Reference
      Scalar.createApiReference("#api-container", {
        url: "openapi-public-api.yaml",
        theme: "purple",
        showSidebar: true,
        darkMode: true,
      });

      // Generate navbar subitems from guides data
      function initNavbar() {
        const container = document.getElementById("nav-guides-subitems");
        container.innerHTML = GUIDES_DATA.map(
          (guide) => `
          <a class="nav-subitem" id="nav-guide-${guide.id}" onclick="showGuide('${guide.file}', '${guide.id}')">
            <img src="${guide.icon}" width="14" height="14" alt="" class="nav-icon" />
            <span>${guide.title}</span>
          </a>
        `
        ).join("");
      }

      // Initialize navbar on page load
      initNavbar();

      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
      }

      function setActiveNav(elementId) {
        document.querySelectorAll(".nav-item, .nav-subitem").forEach((el) => {
          el.classList.remove("active");
        });
        if (elementId) {
          const el = document.getElementById(elementId);
          if (el) el.classList.add("active");
        }
      }

      function showSection(section) {
        const apiContainer = document.getElementById("api-container");
        const guidesContainer = document.getElementById("guides-container");
        const guideContentContainer = document.getElementById("guide-content-container");

        apiContainer.classList.remove("visible");
        guidesContainer.classList.remove("visible");
        guideContentContainer.classList.remove("visible");

        if (section === "api") {
          apiContainer.classList.add("visible");
          setActiveNav("nav-api");
        } else if (section === "guides") {
          guidesContainer.classList.add("visible");
          setActiveNav("nav-guides");
          renderGuidesList();
        }
      }

      /**
       * GitHub-style heading slugs so [text](#understanding-ids) matches ## Understanding IDs.
       * Marked does not emit id on headings by default.
       */
      function addHeadingIdsToGuideContent(root) {
        if (!root) return;
        root.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((el) => {
          if (el.id) return;
          let base = el.textContent
            .trim()
            .toLowerCase()
            .replace(/[^\p{L}\p{N}]+/gu, "-")
            .replace(/^-+|-+$/g, "");
          if (!base) base = "section";
          let id = base;
          let n = 0;
          while (document.getElementById(id)) {
            n++;
            id = base + "-" + n;
          }
          el.id = id;
        });
      }

      /**
       * Markdown links like [x](other-guide.md) resolve against the site root and open
       * raw files. Rewrite them to call showGuide for in-app navigation.
       */
      function rewriteRelativeMarkdownLinks(container) {
        if (!container) return;
        container.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href");
          if (!href || /^https?:\/\//i.test(href) || href.startsWith("mailto:")) return;
          if (href.includes("..")) return;
          const hashIndex = href.indexOf("#");
          const pathPart = hashIndex >= 0 ? href.slice(0, hashIndex) : href;
          if (!pathPart.toLowerCase().endsWith(".md")) return;
          const file = pathPart.replace(/^\.\//, "").split("/").pop();
          const guide = GUIDES_DATA.find((g) => g.file === file);
          if (!guide) return;
          a.setAttribute("href", "#");
          a.addEventListener("click", function (e) {
            e.preventDefault();
            showGuide(file, guide.id);
          });
        });
      }

      document.addEventListener(
        "click",
        function (e) {
          const a = e.target.closest("a");
          if (!a || !a.closest("#guide-content")) return;
          const href = a.getAttribute("href");
          if (!href || /^https?:\/\//i.test(href) || href.startsWith("mailto:")) return;
          if (href.includes("..")) return;

          // In-guide links to API reference operations: "#tag/..." jumps to the
          // Scalar panel and scrolls to the operation.
          if (href.startsWith("#tag/")) {
            e.preventDefault();
            e.stopPropagation();
            showSection("api");
            if (window.location.hash === href) {
              history.replaceState(null, "", window.location.pathname + window.location.search);
            }
            window.location.hash = href;
            return;
          }

          const pathPart = href.split("#")[0];
          if (!pathPart.toLowerCase().endsWith(".md")) return;
          const file = pathPart.replace(/^\.\//, "").split("/").pop();
          const guide = GUIDES_DATA.find((g) => g.file === file);
          if (!guide) return;
          e.preventDefault();
          e.stopPropagation();
          showGuide(file, guide.id);
        },
        true
      );

      function renderGuidesList() {
        const container = document.getElementById("guides-list");
        container.innerHTML = GUIDES_DATA.map(
          (guide) => `
          <a class="guide-card" href="#" onclick="showGuide('${guide.file}', '${guide.id}'); return false;">
            <h3><img src="${guide.icon}" width="20" height="20" alt="" class="guide-icon" /> ${guide.title}</h3>
            <p>${guide.description}</p>
          </a>`
        ).join("");
      }

      function showGuide(file, guideId) {
        const apiContainer = document.getElementById("api-container");
        const guidesContainer = document.getElementById("guides-container");
        const guideContentContainer = document.getElementById("guide-content-container");
        const guideContent = document.getElementById("guide-content");

        apiContainer.classList.remove("visible");
        guidesContainer.classList.remove("visible");
        guideContentContainer.classList.add("visible");
        setActiveNav("nav-guide-" + guideId);

        // Show loading
        guideContent.innerHTML = '<p style="color: #8b8b9e;">Loading...</p>';

        // Fetch and render markdown
        fetch('guides/' + file)
          .then((res) => {
            if (!res.ok) throw new Error('Not found');
            return res.text();
          })
          .then((md) => {
            // Configure marked to rewrite image paths (relative to guides folder)
            const renderer = new marked.Renderer();
            const originalImage = renderer.image.bind(renderer);
            renderer.image = function(token) {
              // Prepend 'guides/' to relative image paths
              if (token.href && !token.href.startsWith('http') && !token.href.startsWith('/')) {
                token.href = 'guides/' + token.href;
              }
              return originalImage(token);
            };
            guideContent.innerHTML = marked.parse(md, { renderer });
            addHeadingIdsToGuideContent(guideContent);
            rewriteRelativeMarkdownLinks(guideContent);
            // Apply syntax highlighting
            document.querySelectorAll("#guide-content pre code").forEach((block) => {
              hljs.highlightElement(block);
            });
          })
          .catch(() => {
            guideContent.innerHTML = `
              <h2 style="color: #f87171;">Guide not found</h2>
              <p style="color: #8b8b9e;">The requested guide could not be loaded.</p>
            `;
          });
      }
    </script>
  </body>
</html>
