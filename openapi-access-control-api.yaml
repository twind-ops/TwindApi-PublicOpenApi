  /v1/companies/{companyId}/visit-register:
    get:
      tags:
      - visit-register-controller
      summary: Get all company visits
      description: "\n            Retrieves paginated visit records for a company.\n\
        \            The 'sites' filter parameter accepts site IDs which can be obtained\
        \ from\n            [GET /v1/companies/{companyId}/sites](#tag/site-controller/GET/v1/companies/{companyId}/sites)\n\
        \n            **Allowed sort fields:**\n            - `visitor_name` - Visitor\
        \ name\n            - `company_name` - Company name\n            - `resource_name`\
        \ - Visited person name\n            - `site_name` - Site name\n         \
        \   - `entry_at` - Entry timestamp\n            - `exit_at` - Exit timestamp\
        \ (default, missing on top)\n\n            **Sort format:** `?sort=field,direction`\
        \ (e.g., `?sort=exit_at,desc`)\n\n            **Search:** Use `q` to filter\
        \ by visitor name, identity number (national ID, passport, SSN, etc.), or\
        \ vehicle registration plate (case insensitive, partial match).\n        \
        \    "
      operationId: getAllCompanyVisits
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: visitors
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: companies
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sites
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: plateNumbers
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: onlyAtSite
        in: query
        required: false
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "exit_at,DESC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved visits
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetCompanyVisitsResponse"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetCompanyVisitsResponse"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetCompanyVisitsResponse"
    post:
      tags:
