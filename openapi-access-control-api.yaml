components:
  schemas:
    CreateVisitorDto:
      type: object
      properties:
        visitorName:
          type: string
          minLength: 1
        visitorSurname:
          type: string
          minLength: 1
        visitorIdentityType:
          type: string
          minLength: 1
        visitorIdentity:
          type: string
          minLength: 1
        visitorEmail:
          type: string
          format: email
        visitorPlateNumber:
          type: string
          pattern: .*\S.*
        companyName:
          type: string
          minLength: 1
        companyTaxId:
          type: string
          minLength: 1
        files:
          type: array
          items:
            type: string
      required:
      - companyName
      - companyTaxId
      - visitorIdentity
      - visitorIdentityType
      - visitorName
      - visitorSurname
    IdValue:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    CreateVisitDto:
      type: object
      properties:
        siteId:
          type: string
          format: uuid
        visitorId:
          type: string
          format: uuid
        visitedPerson:
          type: string
          minLength: 1
        entryAt:
          type: string
          format: date-time
        entryReason:
          type: string
          minLength: 1
        entryNotes:
          type: string
        entryOrigin:
          type: string
          description: Origin of the visit entry registration. Indicates where the
            entry was recorded (e.g. web portal or mobile app). Optional; defaults
            to WEB when omitted.
          enum:
          - WEB
          - APP
          example: WEB
      required:
      - entryAt
      - entryReason
      - siteId
      - visitedPerson
      - visitorId
    CreateVehicleDto:
