  /v1/companies/{companyId}/access-control/as-contractor:
    get:
      tags:
      - access-control-controller
      summary: Get access control status by contractor
      description: "\n            Retrieves paginated access control statuses for\
        \ resources when the company acts as a contractor.\n            Results are\
        \ filtered based on the user's client company and site visibility.\n     \
        \       Subcontractor filtering (companyScope and contractorIds).\n\n    \
        \        **Allowed sort fields:**\n            - `client_name` - Client company\
        \ name\n            - `contractor_name` - Contractor company name\n      \
        \      - `resource_name` - Resource name (employee, vehicle, or equipment)\n\
        \            - `site_name` - Site name (default)\n            - `end_of_access`\
        \ - End of access date\n\n            **Sort format:** `?sort=field,direction`\
        \ (e.g., `?sort=site_name,asc`)\n            "
      operationId: getAccessControlStatusByContractor
      parameters:
      - name: companyId
        in: path
        description: Company ID acting as contractor
        required: true
        schema:
          type: string
          format: uuid
      - name: clientId
        in: query
        description: "Filter by client ID. Results are automatically filtered based\
          \ on user's client company visibility. Obtain client IDs from [GET /v1/companies/{contractorId}/clients](#tag/company-controller/GET/v1/companies/{contractorId}/clients)"
        required: false
        schema:
          type: string
          format: uuid
      - name: siteId
        in: query
        description: "Filter by site ID. Results are automatically filtered based\
          \ on user's client site visibility. Obtain site IDs from [GET /v1/companies/{companyId}/sites](#tag/site-controller/GET/v1/companies/{companyId}/sites)"
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceType
        in: query
        description: "Filter by resource type (EMPLOYEE, EQUIPMENT, VEHICLE)"
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: "Filter by status (ALLOWED, NOT_ALLOWED)"
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        description: Filter by specific resource ID. Obtain resource IDs from the
          response of access-control endpoints (resource.id field)
        required: false
        schema:
          type: string
          format: uuid
      - name: companyScope
        in: query
        description: "Filter by subcontractor scope (ALL, MY_COMPANY, MY_SUBCONTRACTORS)."
        required: false
        schema:
          type: string
          enum:
          - ALL
          - MY_COMPANY
          - MY_SUBCONTRACTORS
      - name: contractorIds
        in: query
        description: Filter by specific contractor IDs. Obtain contractor IDs from
          the response of access-control endpoints (contractor.id field)
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: onlyExpiringInFifteenDays
        in: query
        description: "When true, only show resources with access ending within the\
          \ next 15 days"
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "site_name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved access control statuses
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetAccessControlResponse"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetAccessControlResponse"
        "403":
          description: "Access denied: insufficient permissions. This may occur when\
            \ attempting to use subcontractor filters without proper permissions."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetAccessControlResponse"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetAccessControlResponse"
  /v1/companies/{companyId}/access-control/as-client:
