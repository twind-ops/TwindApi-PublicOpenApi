          type: array
          items:
            type: string
      - name: name
        in: query
        description: Filter by authorization name (partial match)
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetTemporaryAuthorizationListItem"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetTemporaryAuthorizationListItem"
        "403":
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetTemporaryAuthorizationListItem"
    post:
      tags:
      - temporary-authorization-controller
      summary: Create temporary authorization
      description: Creates a temporary authorization for the client company. Each
        resource in resourceIds is added for each site in siteIds (Cartesian product).
      operationId: createTemporaryAuthorization
      parameters:
      - name: companyId
        in: path
        description: Client company ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemporaryAuthorizationDto"
        required: true
      responses:
        "201":
          description: Successfully created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IdValue"
        "400":
          description: "Invalid request (e.g. dateTo < dateFrom, empty siteIds or\
            \ resourceIds)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IdValue"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IdValue"
        "403":
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IdValue"
