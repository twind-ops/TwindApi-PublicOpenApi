openapi: 3.1.0
info:
  title: Access Control API
  description: |-
    API for external systems to manage access control operations.

    ## Authentication

    Use the `X-Api-Key` header with your public API key.

    ## Available Operations

    - **Me**: Get current user information and associated companies
    - **Sites**: List available sites for filtering
    - **Clients**: List client companies for filtering
    - **My Companies**: List related companies (contractors/clients)
    - **Employees**: List employees for a company
    - **Vehicles**: List vehicles for a company
    - **Equipment**: List equipment for a company
    - **Assigned Resources**: List resources assigned to contracts
    - **Access Register**: Register entries and exits for workers and vehicles
    - **Access Control**: Query access control status
    - **Access Card**: Generate access cards (PDF/PNG)
    - **Visitors**: Manage visitor records
    - **Visit Register**: Register visitor entries and exits
  contact:
    name: Twind Support
    email: support@twind.com
  version: "1.0"
servers:
- url: https://app.twind.io/api
  description: Production server
tags:
- name: temporary-authorization-controller
  description: Temporary authorization management API
- name: access-control-controller
  description: Access Control Management API
- name: site-controller
  description: Site Management API
- name: me-controller
  description: Current User Information API
