  /v1/companies/{companyId}/access-register:
    get:
      tags:
      - access-register-controller
      summary: Get access register records
      description: "\n            Retrieves paginated access register records for\
        \ a company.\n\n            **Allowed sort fields:**\n            - `client_name`\
        \ - Client company name\n            - `contractor_name` - Contractor company\
        \ name\n            - `resource_name` - Resource name\n            - `site_name`\
        \ - Site name\n            - `entry_at` - Entry timestamp (default)\n    \
        \        - `exit_at` - Exit timestamp\n\n            **Sort format:** `?sort=field,direction`\
        \ (e.g., `?sort=entry_at,desc`)\n        "
      operationId: getAccessRegisterRecords
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: siteId
        in: query
        description: "Filter by site ID. Obtain site IDs from [GET /v1/companies/{companyId}/sites](#tag/site-controller/GET/v1/companies/{companyId}/sites)"
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceId
        in: query
        description: Filter by resource ID. Obtain resource IDs from access-control
          endpoints (resource.id field)
        required: false
        schema:
          type: string
          format: uuid
      - name: contractorId
        in: query
        description: Filter by contractor ID. Obtain contractor IDs from access-control
          endpoints (contractor.id field)
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceType
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: entryOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: latestEntrance
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: q
        in: query
        description: "Search query: filters by resource fields (contains, case-insensitive).\
          \ Employee: name, surname, identity ID; Vehicle: name, plate number; Equipment:\
          \ name, serial number."
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "entry_at,DESC"
          items:
            type: string
      responses:
        "200":
          description: Successfully retrieved access register records
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetAccessRegisterResponse"
        "401":
          description: "Unauthorized: authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetAccessRegisterResponse"
        "403":
          description: "Access denied: insufficient permissions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGetAccessRegisterResponse"
    post:
      tags:
      - access-register-controller
      operationId: createAccessRegisterEntry
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
